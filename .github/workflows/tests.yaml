name: Tests (pytest)

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
    paths:
      - "**.csv"
      - "**.npy"
      - "**.out"
      - "**.pkl"
      - "**.png"
      - "**.py"
      - "**.toml"
      - "**.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Ex1 (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.11", "3.12"]
    # env:
    # QT_QPA_PLATFORM: offscreen
    # LIBGL_ALWAYS_SOFTWARE: "1"
    # QT_OPENGL: software
    # XDG_RUNTIME_DIR: /tmp
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install and setup uv with python
        uses: astral-sh/setup-uv@v10.4.0
        with:
          activate-environment: true
          python-version: ${{ matrix.python-version }}
      - name: Set up display and OpenGL
        uses: pyvista/setup-headless-display-action@v5
        with:
          qt: true
          pyvista: false
      - name: Install package dependencies in activated environment
        shell: bash
        run: |
          uv sync --frozen --all-extras --dev
      - name: Pytest
        run: |
          uv run pytest --cov=napari-afmreader/src --cov-branch --numprocesses=logical
      - name: Determine coverage
        if: runner.os = 'Linux'
        run: |
          coverage xml
      - name: Upload coverage to Codecov
        if: runner.os = 'Linux'
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Setup tmate session
        if: ${{ failure() }}
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 5
